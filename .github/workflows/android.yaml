name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - '**/src/main/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches:
      - main
    paths:
      - '**/src/main/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Signing Config
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p doconfig
          echo $SIGNING_KEYSTORE_BASE64 | base64 -d > doconfig/keystore.jks
          echo packageName=com.madness.collision > doconfig/custom.properties
          echo signingKeyStorePath=doconfig/keystore.jks >> doconfig/custom.properties
          echo signingKeyStorePassword=$SIGNING_KEYSTORE_PASSWORD >> doconfig/custom.properties
          echo signingKeyAlias=$SIGNING_KEY_ALIAS >> doconfig/custom.properties
          echo signingKeyPassword=$SIGNING_KEY_PASSWORD >> doconfig/custom.properties

      - name: Build Foss APKs
        run: |
          mkdir -p build/outputs/apks/foss
          ./gradlew printBundleToolVersion
          java -jar /usr/local/lib/android/sdk/build-tools/*/bundletool.jar build-apks --bundle=app/build/outputs/bundle/fossRelease/app-foss-release.aab --output=app/build/outputs/app-universal-foss.apks --ks=doconfig/keystore.jks --ks-pass=pass:${{ secrets.SIGNING_KEYSTORE_PASSWORD }} --ks-key-alias=${{ secrets.SIGNING_KEY_ALIAS }} --key-pass=pass:${{ secrets.SIGNING_KEY_PASSWORD }} --mode=universal
          cp app/build/outputs/app-universal-foss.apks build/outputs/apks/foss/

      - name: Build Universal APKs
        run: |
          mkdir -p build/outputs/apks/release
          ./gradlew printBundleToolVersion
          java -jar /usr/local/lib/android/sdk/build-tools/*/bundletool.jar build-apks --bundle=app/build/outputs/bundle/release/app-release.aab --output=app/build/outputs/app-universal-release.apks --ks=doconfig/keystore.jks --ks-pass=pass:${{ secrets.SIGNING_KEYSTORE_PASSWORD }} --ks-key-alias=${{ secrets.SIGNING_KEY_ALIAS }} --key-pass=pass:${{ secrets.SIGNING_KEY_PASSWORD }} --mode=universal
          cp app/build/outputs/app-universal-release.apks build/outputs/apks/release/

      - name: Upload Foss APKs
        uses: actions/upload-artifact@v4
        with:
          name: foss-apks-${{ github.run_number }}-${{ env.COMMIT_HASH }}
          path: build/outputs/apks/foss/

      - name: Upload Universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: universal-apks-${{ github.run_number }}-${{ env.COMMIT_HASH }}
          path: build/outputs/apks/release/

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
