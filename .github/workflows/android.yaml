name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/src/main/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches:
      - main
    paths:
      - '**/src/main/**'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Detect Signing Availability
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Signing Config
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p doconfig
          echo $SIGNING_KEYSTORE_BASE64 | base64 -d > doconfig/keystore.jks
          echo packageName=com.madness.collision > doconfig/custom.properties
          echo signingKeyStorePath=doconfig/keystore.jks >> doconfig/custom.properties
          echo signingKeyStorePassword=$SIGNING_KEYSTORE_PASSWORD >> doconfig/custom.properties
          echo signingKeyAlias=$SIGNING_KEY_ALIAS >> doconfig/custom.properties
          echo signingKeyPassword=$SIGNING_KEY_PASSWORD >> doconfig/custom.properties

      - name: Fix Gradle Wrapper Permissions
        run: chmod +x gradlew

      # Release build with signing (when secrets are available)
      - name: Build Release AABs
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew bundleFoss bundleRelease

      - name: Build Foss APKs (signed)
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p build/outputs/apks/foss
          java -jar /usr/local/lib/android/sdk/build-tools/*/bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/foss/app-foss.aab \
            --output=app/build/outputs/app-universal-foss.apks \
            --ks=doconfig/keystore.jks \
            --ks-pass=pass:${{ secrets.SIGNING_KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.SIGNING_KEY_PASSWORD }} \
            --mode=universal
          cp app/build/outputs/app-universal-foss.apks build/outputs/apks/foss/

      - name: Build Universal APKs (signed)
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p build/outputs/apks/release
          java -jar /usr/local/lib/android/sdk/build-tools/*/bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=app/build/outputs/app-universal-release.apks \
            --ks=doconfig/keystore.jks \
            --ks-pass=pass:${{ secrets.SIGNING_KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.SIGNING_KEY_PASSWORD }} \
            --mode=universal
          cp app/build/outputs/app-universal-release.apks build/outputs/apks/release/

      # Debug build (when no signing secrets)
      - name: Build Debug APKs
        if: steps.signing.outputs.available == 'false'
        run: |
          ./gradlew assembleFoss assembleDebug
          mkdir -p build/outputs/apks/foss build/outputs/apks/release
          find app/build/outputs -name '*.apk' | while read f; do
            if echo "$f" | grep -q foss; then
              cp "$f" build/outputs/apks/foss/
            else
              cp "$f" build/outputs/apks/release/
            fi
          done

      - name: Upload Foss APKs
        uses: actions/upload-artifact@v4
        with:
          name: foss-apks-${{ github.run_number }}-${{ env.COMMIT_HASH }}
          path: build/outputs/apks/foss/

      - name: Upload Universal APKs
        uses: actions/upload-artifact@v4
        with:
          name: universal-apks-${{ github.run_number }}-${{ env.COMMIT_HASH }}
          path: build/outputs/apks/release/
